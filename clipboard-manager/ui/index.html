<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clipboard History</title>
  <style>
    :root {
      --bg: #f8fafc; --panel: #ffffff; --ink: #0f172a; --quiet: #64748b; --line: #e2e8f0; --accent: #10b981; --accent-glow: rgba(16, 185, 129, 0.2);
      color-scheme: light dark; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #090d16; --panel: #0f172a; --ink: #f8fafc; --quiet: #94a3b8; --line: #1e293b; --accent: #34d399; --accent-glow: rgba(52, 211, 153, 0.25); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    main { max-width: 680px; margin: 0 auto; padding: 36px 20px; }
    h1 { margin: 0 0 16px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .add-box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 24px; box-shadow: 0 4px 16px -2px rgba(0,0,0,0.06); }
    .input-row { display: flex; gap: 10px; }
    input { flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    button.primary { padding: 10px 20px; border: 0; border-radius: 9999px; background: var(--accent); color: #002917; font: inherit; font-weight: 700; cursor: pointer; }
    button.primary:hover { opacity: 0.92; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    li { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .clip-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-copy { padding: 6px 14px; border: 1px solid var(--line); border-radius: 9999px; background: transparent; color: var(--ink); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-copy:hover { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
    .empty { color: var(--quiet); text-align: center; padding: 32px; }
  </style>
</head>
<body>
  <main>
    <h1>Clipboard History</h1>
    <div class="add-box">
      <form id="add-form" class="input-row">
        <input type="text" id="clip-input" placeholder="Save a new snippet or boilerplate…" required>
        <button type="submit" class="primary">Save</button>
      </form>
    </div>
    <ul id="clips-list"></ul>
    <p id="empty-msg" class="empty">No snippets saved yet.</p>
  </main>
  <script type="module">
    let sdk = null;
    try { sdk = await import('/__appshell/sdk.js'); } catch {}
    const clips = (sdk ? await sdk.storage.get('clips') : JSON.parse(localStorage.getItem('clips') || 'null')) || [
      'git commit -m "feat: initial commit"',
      'import { backend, storage, widgets } from "/__appshell/sdk.js";',
      'const [state, setState] = useState(null);'
    ];

    async function sync() {
      if (sdk) {
        await sdk.storage.set('clips', clips);
        await sdk.widgets.update('recent-clips', {
          blocks: [
            { type: 'metric', label: 'Pinned Clips', value: clips.length },
            { type: 'text', text: clips[0] || 'No clips' }
          ]
        });
      } else {
        localStorage.setItem('clips', JSON.stringify(clips));
      }
      render();
    }

    function render() {
      const list = document.getElementById('clips-list');
      const empty = document.getElementById('empty-msg');
      empty.hidden = clips.length > 0;
      list.innerHTML = '';
      clips.forEach((c, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="clip-text">${c.replace(/</g, '&lt;')}</span><button class="btn-copy">Copy</button>`;
        li.querySelector('.btn-copy').addEventListener('click', (e) => {
          navigator.clipboard.writeText(c);
          e.target.textContent = 'Copied!';
          setTimeout(() => e.target.textContent = 'Copy', 1500);
        });
        list.appendChild(li);
      });
    }

    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('clip-input');
      if (input.value.trim()) {
        clips.unshift(input.value.trim());
        input.value = '';
        sync();
      }
    });

    sync();
  </script>
</body>
</html>
