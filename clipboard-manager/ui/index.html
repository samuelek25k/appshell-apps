<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clipboard History</title>
  <link rel="stylesheet" href="/__appshell/ui.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body class="ui">
  <main>
    <h1>Clipboard History</h1>
    <div class="add-box">
      <form id="add-form" class="input-row">
        <input type="text" id="clip-input" placeholder="Save a new snippet or boilerplate…" required>
        <button type="submit" class="primary">Save</button>
      </form>
    </div>
    <ul id="clips-list"></ul>
    <p id="empty-msg" class="empty">No snippets saved yet.</p>
  </main>
</body>
</html>
