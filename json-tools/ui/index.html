<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JSON Formatter & Studio</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- Top Action Bar -->
    <header class="toolbar">
      <div class="brand">
        <span class="glyph">{ }</span>
        <span class="title">JSON Studio</span>
      </div>
      
      <div class="actions">
        <button type="button" id="btn-format" class="btn-action primary">Prettify (2 SP)</button>
        <button type="button" id="btn-minify" class="btn-action">Minify</button>
        <button type="button" id="btn-to-ts" class="btn-action">To TypeScript</button>
        <button type="button" id="btn-sample" class="btn-action">Sample</button>
        <button type="button" id="btn-clear" class="btn-action">Clear</button>
        <button type="button" id="btn-copy" class="btn-action highlight">Copy Output</button>
      </div>
    </header>

    <!-- Editor Split Workspace -->
    <main class="workspace">
      <!-- Input Column -->
      <section class="pane">
        <div class="pane-header">
          <span class="pane-title">Input JSON</span>
          <span id="input-stats" class="pane-stats">0 lines</span>
        </div>
        <textarea id="json-input" placeholder="Paste raw JSON, query response, or dirty object..." spellcheck="false"></textarea>
      </section>

      <!-- Output Column -->
      <section class="pane">
        <div class="pane-header">
          <span class="pane-title">Formatted Result / TypeScript Type</span>
          <span id="output-status" class="pane-badge valid">Valid JSON</span>
        </div>
        <div class="output-container">
          <pre id="json-output"><code id="code-output">// Formatted JSON will appear here</code></pre>
        </div>
      </section>
    </main>

    <!-- Bottom Status Bar -->
    <footer class="statusbar">
      <div id="status-left">Ready</div>
      <div id="status-right">100% Offline & Private</div>
    </footer>
  </div>
</body>
</html>
