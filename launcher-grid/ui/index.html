<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grid Home</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main>
    <section id="widgets" class="widgets" aria-label="Widgets"></section>
    <section aria-label="Apps">
      <ul id="grid" class="grid"></ul>
      <p id="empty" class="quiet" hidden>No apps installed yet. Open Settings to add some.</p>
    </section>
    <footer>
      <div id="accents" class="swatches" role="group" aria-label="Accent colour"></div>
      <div id="modes" class="modes" role="group" aria-label="Theme">
        <button type="button" data-mode="system">Auto</button>
        <button type="button" data-mode="light">Light</button>
        <button type="button" data-mode="dark">Dark</button>
      </div>
    </footer>
  </main>
</body>
</html>
