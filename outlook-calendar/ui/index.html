<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outlook & Daily Agenda</title>
  <link rel="stylesheet" href="tailwind.css">
  <script type="module" src="main.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-4 sm:p-6 font-sans antialiased min-h-screen">
  <div class="max-w-2xl mx-auto space-y-6">
    
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-sky-600 flex items-center justify-center font-bold text-white text-base shadow-sm">O</div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-tight">Outlook & Daily Agenda</h1>
          <p class="text-xs text-slate-400 font-mono" id="current-date"></p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <label for="ics-input" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 border border-slate-700 cursor-pointer transition-colors flex items-center gap-1.5">
          <span>📥 Import .ics</span>
          <input type="file" id="ics-input" accept=".ics,text/calendar" class="hidden">
        </label>
        <button id="add-btn" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-xs font-semibold text-white transition-colors flex items-center gap-1">
          <span>+ Add Event</span>
        </button>
      </div>
    </div>

    <div class="p-3.5 bg-slate-900 border border-slate-800 text-xs text-slate-300 flex items-start justify-between gap-3">
      <div>
        <span class="font-bold text-white block mb-0.5">Private Local Agenda & Widget Sync</span>
        <span class="text-slate-400">Works 100% offline with zero network telemetry. Imports standard iCalendar (.ics) files and automatically syncs your next meeting to the Appshell dashboard.</span>
      </div>
      <span class="px-2 py-0.5 bg-sky-950 text-sky-400 border border-sky-800 text-[10px] font-mono whitespace-nowrap">Local Sandbox</span>
    </div>

    <div id="add-form" class="hidden p-4 bg-slate-900 border border-slate-800 space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">New Schedule Event</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
        <div class="sm:col-span-2">
          <label class="block text-slate-400 mb-1">Event Title *</label>
          <input id="ev-title" type="text" placeholder="e.g. Design System Review" class="w-full bg-slate-950 border border-slate-800 px-3 py-1.5 text-white focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Start Time *</label>
          <input id="ev-start" type="time" value="10:00" class="w-full bg-slate-950 border border-slate-800 px-3 py-1.5 text-white focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">End Time *</label>
          <input id="ev-end" type="time" value="10:45" class="w-full bg-slate-950 border border-slate-800 px-3 py-1.5 text-white focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Type</label>
          <select id="ev-type" class="w-full bg-slate-950 border border-slate-800 px-3 py-1.5 text-white focus:outline-none focus:border-sky-500">
            <option value="Teams Meeting">Microsoft Teams</option>
            <option value="In-Person">In-Person</option>
            <option value="1:1 Sync">1:1 Sync</option>
            <option value="Focus Block">Deep Focus</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Location / Join Link</label>
          <input id="ev-loc" type="text" placeholder="e.g. Teams Call or Conf Room 3" class="w-full bg-slate-950 border border-slate-800 px-3 py-1.5 text-white focus:outline-none focus:border-sky-500">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button id="cancel-add-btn" type="button" class="px-3 py-1 text-xs text-slate-400 hover:text-white">Cancel</button>
        <button id="save-ev-btn" type="button" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-500 text-xs font-semibold text-white">Save Event</button>
      </div>
    </div>

    <div class="space-y-3">
      <div class="flex items-center justify-between text-xs text-slate-400 font-semibold px-1">
        <span id="agenda-count">Today's Agenda</span>
        <button id="clear-btn" class="hover:text-rose-400 font-mono text-[11px] transition-colors">Clear All</button>
      </div>

      <div id="meetings-list" class="space-y-2.5">
      </div>
    </div>

  </div>

</body>
</html>
