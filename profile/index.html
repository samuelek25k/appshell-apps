<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main>
    <h1>Profile</h1>
    <form id="form">
      <label>Name <input name="name" autocomplete="name" maxlength="80" required></label>
      <label>Email <input name="email" type="email" autocomplete="email" maxlength="120"></label>
      <label>Role <input name="role" maxlength="80"></label>
      <div class="row">
        <button type="submit">Save</button>
        <span id="status" role="status"></span>
      </div>
    </form>
  </main>
</body>
</html>
