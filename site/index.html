<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>App store</title>
  <link rel="stylesheet" href="store.css">
  <script type="module" src="store.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><span id="store-name">App store</span></a>
    <input id="search" type="search" placeholder="Search apps" aria-label="Search apps">
  </header>
  <main id="view" aria-live="polite"></main>
  <footer class="foot">
    <p>Every release is built from source by CI and pinned by its SHA-256. The desktop app checks the digest and the app's manifest before installing.</p>
  </footer>
  <div id="toast" role="status" hidden></div>
</body>
</html>
